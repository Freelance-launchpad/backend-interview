version: "2"
run:
  build-tags:
    - integration
linters:
  disable:
    - staticcheck # TODO: re-enable when https://github.com/golangci/golangci-lint/issues/6363 is fixed
    - unparam # TODO: seems related to https://github.com/golangci/golangci-lint/issues/6363, same false positive
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - misspell
    - paralleltest
    - testifylint
    - jerrorwrapdefer
    - transactorctx
    - unparam
  settings:
    misspell:
      mode: restricted # Only lint comments
    paralleltest:
      ignore-missing-subtests: true # Using t.Parallel in subtests doesn't bring a lot of performance benefits.
    staticcheck:
      checks:
        - all
        - "-SA1019" # Disallow the use of deprecated functions or types.
        - "-ST1003" # Disallow the use of underscores in package names.
    testifylint:
      enable-all: true
      disable:
        - expected-actual # requires that we use (t, expected, actual) instead of (t, actual, expected), but it doesn't make a difference
        - float-compare # requires that we use assert.InEpsilon/InDelta for float comparisons, but we don't have issues in practice
        - require-error # requires that we use testify/require instead of testify/assert for error checking, but it's not necessary
        - len # requires that we use assert.Len instead of assert.Equal for length checking
    unparam:
      check-exported: true
    custom:
      jerrorwrapdefer:
        type: "module"
        description: Checks that jerror.Wrap is used after a defer.
      transactorctx:
        type: "module"
        description: Checks that transactor.WithinTransaction has a named context parameter.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - unparam
        path: services/bootstrap
      - linters:
          - paralleltest
        path: services/fees/test
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
